# Listen inside the container; Compose exposes this port only on localhost.
listener 8883
allow_anonymous true
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
# Keep sessions and queued QoS 1 messages across broker restarts.
persistence true
persistence_location /mosquitto/data/
autosave_interval 1
max_queued_messages 100000
log_dest stdout
log_type all
